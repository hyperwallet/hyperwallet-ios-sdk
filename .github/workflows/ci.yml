name: iOS Core SDK CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - support/SDK-V3
      - feature/**
      - bugfix/**

jobs:
  test:
    name: Test - ${{ matrix.os }} - ${{ matrix.xcode_version }} - ${{ matrix.fastlane_task }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode_version: 26.6
            fastlane_task: unit_tests

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '${{ matrix.xcode_version }}'

      - name: Carthage [Setup cache]
        uses: actions/cache@v3
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('**/Cartfile.resolved') }}
          restore-keys: |
            ${{ runner.os }}-carthage-${{ hashFiles('**/Cartfile.resolved') }}

      - name: Carthage [Install dependencies]
        shell: bash
        run: |
          set +e
          carthage bootstrap --verbose \
            --platform ios \
            --cache-builds \
            --use-xcframeworks \
            --no-use-binaries
          carthage_status=$?

          log_dir="${TMPDIR:-/tmp}"
          echo "Searching for Carthage logs in: $log_dir"
          find "$log_dir" -maxdepth 1 -type f -name 'carthage-xcodebuild.*.log' \
            -print -exec sh -c '
              for log do
                echo "=== $log ==="
                grep -n -C 4 -E "error:|fatal error:|BUILD FAILED" "$log" || tail -n 100 "$log"
              done
            ' sh {} +

          exit "$carthage_status"

      - name: Run ${{ matrix.task_title }}
        run: fastlane ${{ matrix.fastlane_task }}

      - name: Install Lint
        run:
          brew install swiftlint

      - name: Lint validation
        run: 
          swiftlint lint --strict --reporter json

      - name: Code Coverage [Build report]
        run: |
          brew install llvm
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          llvm-cov report \
          --use-color \
          --instr-profile=$(find ./output -name "*.profdata") \
          --object $(find ./output -name "HyperwalletSDK") \
          -ignore-filename-regex="HyperwalletPrepaidCard.swift|/HyperwalletUser.swift"

      - name: Code Coverage [Export report to lcov format]
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          mkdir coverage
          llvm-cov export \
          --format=lcov > ./coverage/lcov.info \
          --instr-profile=$(find ./output -name "*.profdata") \
          --object $(find ./output -name "HyperwalletSDK") \
          -ignore-filename-regex="HyperwalletPrepaidCard.swift|/HyperwalletUser.swift"

      - name: Post to Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
